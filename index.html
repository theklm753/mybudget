<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBudget - Gestion de Budget</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neonPink: '#ff007f', neonPurple: '#9d00ff', neonCyan: '#0099ff',
                        lightBg: '#f8fafc', cardBg: '#ffffff'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chargement des données externes -->
    <script src="data.js"></script>
</head>
<body class="bg-lightBg text-slate-800 font-sans min-h-screen selection:bg-neonPink selection:text-white pb-20">

    <!-- Bandeau Haut : Application & Profil -->
    <div class="bg-gradient-to-r from-neonPink via-neonPurple to-neonCyan text-white shadow-md relative z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Logo & Nom -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-sm border border-white/30">
                    <i class="fa-solid fa-wallet text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-wider text-white">
                    MYBUDGET
                </h1>
            </div>
            <!-- Profil utilisateur -->
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <div class="text-sm font-bold">Anne-Sophie</div>
                    <div class="text-[10px] text-white/80 uppercase tracking-wide">Connectée</div>
                </div>
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center border border-white/30 shadow-inner">
                    <i class="fa-solid fa-user text-white"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Bandeau Navigation : Mois & Vues -->
    <header class="bg-cardBg border-b border-slate-200 sticky top-0 z-40 backdrop-blur-md bg-opacity-90 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
            
            <!-- Navigation des Mois -->
            <div class="flex items-center bg-slate-50 p-1.5 rounded-2xl border border-slate-200 shadow-inner w-full sm:w-auto justify-between sm:justify-start">
                <button onclick="changeMonth(-1)" class="px-3 py-1 text-slate-400 hover:text-slate-800 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="px-4 font-black text-slate-700 min-w-[150px] text-center" id="current-month-display">Octobre 2026</div>
                <button onclick="changeMonth(1)" class="px-3 py-1 text-slate-400 hover:text-slate-800 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- Sélecteur de Vue -->
            <div class="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200 w-full sm:w-auto justify-center">
                <button onclick="switchView('moi')" id="btn-moi" class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center"><i class="fa-solid fa-user mr-2"></i>Personnel</button>
                <button onclick="switchView('commun')" id="btn-commun" class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center"><i class="fa-solid fa-users mr-2"></i>Commun</button>
                <button onclick="switchView('pro')" id="btn-pro" class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center"><i class="fa-solid fa-briefcase mr-2"></i>Pro</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Dashboard Widgets & Graphique -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            
            <!-- Colonne Kpis (3 colonnes) -->
            <div class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-4">
                
                <!-- Solde (Bloc Dynamique) -->
                <div id="solde-card" class="bg-cardBg border border-slate-200 p-5 rounded-2xl shadow-sm relative overflow-hidden group transition-all duration-300">
                    <div class="flex justify-between items-start">
                        <span id="solde-label" class="text-xs font-bold uppercase text-slate-400 transition-colors">Solde Restant</span>
                        <div class="flex items-center gap-2">
                            <span id="solde-warning"></span>
                            <i id="solde-icon" class="fa-solid fa-scale-balanced text-slate-200 text-2xl transition-colors"></i>
                        </div>
                    </div>
                    <div class="text-3xl font-black mt-2 transition-colors duration-300" id="stat-balance">0,00 €</div>
                    <div id="solde-sublabel" class="text-xs text-slate-400 mt-2 font-semibold transition-colors">Budget global <span id="stat-total-budget" class="text-slate-600 transition-colors">0€</span></div>
                    <!-- Jauge globale -->
                    <div class="w-full bg-slate-100/50 rounded-full h-2 mt-3 overflow-hidden">
                        <div id="global-progress" class="h-full rounded-full transition-all" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Dépenses -->
                <div class="bg-cardBg border border-slate-200 p-5 rounded-2xl shadow-sm relative group">
                    <span class="text-xs font-bold uppercase text-slate-400">Dépenses du mois</span>
                    <div class="text-3xl font-black mt-2 text-neonCyan" id="stat-expenses">0,00 €</div>
                    <button onclick="openModal('expenseModal')" class="mt-3 w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-neonCyan font-bold py-2 rounded-xl text-xs transition-all"><i class="fa-solid fa-plus-circle"></i> Saisir Dépense</button>
                </div>

                <!-- Revenus -->
                <div class="bg-cardBg border border-slate-200 p-5 rounded-2xl shadow-sm relative group">
                    <span class="text-xs font-bold uppercase text-slate-400">Revenus du Mois</span>
                    <div class="text-3xl font-black mt-2 text-neonPink" id="stat-incomes">0,00 €</div>
                    <button onclick="openModal('incomeModal')" class="mt-3 w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-neonPink font-bold py-2 rounded-xl text-xs transition-all"><i class="fa-solid fa-money-bill-trend-up"></i> Saisir Revenu</button>
                </div>
            </div>

            <!-- Colonne Graphique Camembert -->
            <div class="bg-cardBg border border-slate-200 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center">
                <span class="text-xs font-bold uppercase text-slate-400 mb-2 w-full text-left">Répartition</span>
                <div class="w-full h-32 relative">
                    <canvas id="expensePieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Section Enveloppes Budgétaires -->
        <div class="bg-cardBg border border-slate-200 rounded-3xl p-6 shadow-sm">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-black flex items-center gap-2 text-slate-800">
                        <i class="fa-solid fa-envelope-open-text text-neonPink"></i> Enveloppes du mois
                    </h2>
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="prepareBilan()" class="flex-1 bg-amber-50 border border-amber-200 text-amber-600 hover:bg-amber-100 font-bold px-4 py-2 rounded-xl transition-all text-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-scale-unbalanced"></i> Faire le Bilan
                    </button>
                    <button onclick="openModal('envelopeModal')" class="flex-1 bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 font-bold px-4 py-2 rounded-xl transition-all text-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Créer
                    </button>
                </div>
            </div>

            <!-- Grille des enveloppes -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="envelopes-container">
                <!-- Généré dynamiquement -->
            </div>
        </div>

        <!-- Historique des Dépenses -->
        <div class="bg-cardBg border border-slate-200 rounded-3xl p-6 shadow-sm">
            <h2 class="text-xl font-black flex items-center gap-2 text-slate-800 mb-4">
                <i class="fa-solid fa-clock-rotate-left text-neonCyan"></i> Historique
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                        <tr>
                            <th class="p-3">Date</th><th class="p-3">Libellé</th><th class="p-3">Enveloppe</th><th class="p-3 text-right">Montant</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL : Bilan du Mois -->
    <div id="bilanModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-amber-300 rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl relative">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h3 class="text-xl font-black text-amber-600 flex items-center gap-2"><i class="fa-solid fa-scale-unbalanced"></i> Bilan du mois</h3>
                <button onclick="closeModal('bilanModal')" class="text-slate-400 hover:text-slate-800"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6" id="bilan-content">
                <!-- Rempli dynamiquement par JS -->
            </div>
            <div class="p-6 border-t border-slate-100 shrink-0">
                <button onclick="executeBilan()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3 rounded-xl shadow-md hover:opacity-90">Valider les transferts</button>
            </div>
        </div>
    </div>

    <!-- MODAL : Graphique Historique Enveloppe -->
    <div id="historyModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg rounded-3xl w-full max-w-lg p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black text-slate-800 flex items-center gap-2" id="hist-title"><i class="fa-solid fa-chart-bar"></i> Historique</h3>
                <button onclick="closeModal('historyModal')" class="text-slate-400 hover:text-slate-800"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <canvas id="envHistoryChart" class="w-full h-64"></canvas>
        </div>
    </div>

    <!-- MODAL : Ajouter/Modifier Enveloppe -->
    <div id="envelopeModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black text-neonPurple flex items-center gap-2" id="env-modal-title"><i class="fa-solid fa-folder-plus"></i> Créer/Modifier</h3>
                <button onclick="closeModal('envelopeModal')" class="text-slate-400 hover:text-slate-800"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleEnvelopeSubmit(event)" class="space-y-4">
                <input type="hidden" id="env-id">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nom</label>
                    <input type="text" id="env-name" required class="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-sm focus:border-neonPurple focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Portefeuille</label>
                        <select id="env-wallet" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm focus:border-neonPurple focus:outline-none">
                            <option value="moi">Personnel</option><option value="commun">Commun</option><option value="pro">Pro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Budget Mensuel</label>
                        <input type="number" step="0.01" id="env-budget" required class="w-full bg-slate-50 border rounded-xl px-4 py-2.5 font-bold text-sm focus:border-neonPurple focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Alerte (% consommé)</label>
                        <input type="number" id="env-alert" value="80" class="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-sm focus:border-neonPurple focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Type</label>
                        <select id="env-type" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm focus:border-neonPurple focus:outline-none">
                            <option value="classic">Classique</option><option value="savings">Épargne 🏦</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Icône</label>
                        <select id="env-icon" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm font-awesome focus:border-neonPurple focus:outline-none">
                            <option value="fa-basket-shopping">🛒 Courses</option>
                            <option value="fa-utensils">🍽️ Restaurant</option>
                            <option value="fa-car">🚗 Transport</option>
                            <option value="fa-house">🏠 Maison</option>
                            <option value="fa-baby">👶 Bébé</option>
                            <option value="fa-heart-pulse">❤️ Santé</option>
                            <option value="fa-shirt">👕 Vêtements</option>
                            <option value="fa-hammer">🔨 Bricolage</option>
                            <option value="fa-palette">🎨 Matériel Art</option>
                            <option value="fa-book">📚 Édition</option>
                            <option value="fa-laptop">💻 Digital/Web</option>
                            <option value="fa-plane">✈️ Vacances</option>
                            <option value="fa-piggy-bank">🐷 Épargne</option>
                            <option value="fa-ellipsis">🔹 Autre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Couleur</label>
                        <select id="env-color" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm focus:border-neonPurple focus:outline-none">
                            <option value="pink">Rose Vif</option>
                            <option value="purple">Violet</option>
                            <option value="cyan">Cyan</option>
                            <option value="emerald">Vert Émeraude</option>
                            <option value="amber">Orange</option>
                            <option value="red">Rouge</option>
                            <option value="blue">Bleu</option>
                            <option value="fuchsia">Fuchsia</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-neonPurple to-pink-600 text-white font-bold py-3 rounded-xl shadow-md hover:opacity-90">Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- MODALS DÉPENSE ET REVENU INCLUS -->
    <div id="expenseModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-neonPink/50 rounded-3xl w-full max-w-md p-6 shadow-xl"><div class="flex justify-between mb-4"><h3 class="text-lg font-black text-neonPink"><i class="fa-solid fa-minus-circle"></i> Dépense</h3><button onclick="closeModal('expenseModal')" class="text-slate-400 hover:text-slate-800"><i class="fa-solid fa-xmark text-lg"></i></button></div><form onsubmit="handleExpenseSubmit(event)" class="space-y-4"><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Montant (€)</label><input type="number" step="0.01" id="exp-amount" required class="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-lg font-bold"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Portefeuille</label><select id="exp-wallet" onchange="updateEnvelopeOptions()" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm"><option value="moi">Personnel</option><option value="commun">Commun</option><option value="pro">Pro</option></select></div><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Enveloppe</label><select id="exp-envelope" required class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm"></select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Date</label><input type="date" id="exp-date" required class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm"></div><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Note</label><input type="text" id="exp-note" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm"></div></div><button type="submit" class="w-full bg-gradient-to-r from-neonPink to-neonPurple text-white font-bold py-3 rounded-xl shadow-md">Valider</button></form></div>
    </div>
    <div id="incomeModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-neonPink/50 rounded-3xl w-full max-w-md p-6 shadow-xl"><div class="flex justify-between mb-4"><h3 class="text-lg font-black text-neonPink"><i class="fa-solid fa-money-bill-trend-up"></i> Revenu</h3><button onclick="closeModal('incomeModal')" class="text-slate-400 hover:text-slate-800"><i class="fa-solid fa-xmark text-lg"></i></button></div><form onsubmit="handleIncomeSubmit(event)" class="space-y-4"><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Montant (€)</label><input type="number" step="0.01" id="inc-amount" required class="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-lg font-bold"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Portefeuille</label><select id="inc-wallet" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm"><option value="moi">Personnel</option><option value="commun">Commun</option><option value="pro">Pro</option></select></div><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Date</label><input type="date" id="inc-date" required class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm"></div></div><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Libellé</label><input type="text" id="inc-label" required class="w-full bg-slate-50 border rounded-xl px-4 py-2 text-sm"></div><button type="submit" class="w-full bg-gradient-to-r from-neonPink to-pink-600 text-white font-bold py-3 rounded-xl shadow-md">Valider</button></form></div>
    </div>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        // INIT DATA
        const fallbackData = {
            envelopes: [
                { id: '1', name: 'Courses Bébé & Maison', wallet: 'commun', budget: 500, type: 'classic', color: 'emerald', icon: 'fa-baby', alertThreshold: 80 },
                { id: '2', name: 'Shopping & Perso', wallet: 'moi', budget: 150, type: 'classic', color: 'pink', icon: 'fa-shirt', alertThreshold: 80 },
                { id: '3', name: 'Édition (SOFI) & Impression', wallet: 'pro', budget: 300, type: 'classic', color: 'purple', icon: 'fa-book', alertThreshold: 90 },
                { id: '4', name: 'Matériel Illustration', wallet: 'pro', budget: 100, type: 'classic', color: 'cyan', icon: 'fa-palette', alertThreshold: 80 }
            ],
            transactions: []
        };
        let db = JSON.parse(localStorage.getItem('my_budget_db')) || window.db || fallbackData;

        // Configuration Couleurs
        const colorMap = {
            'pink': 'from-pink-500 to-rose-500 text-pink-600 border-pink-200 bg-pink-50',
            'purple': 'from-purple-500 to-indigo-500 text-purple-600 border-purple-200 bg-purple-50',
            'cyan': 'from-cyan-500 to-blue-500 text-cyan-600 border-cyan-200 bg-cyan-50',
            'emerald': 'from-emerald-500 to-teal-500 text-emerald-600 border-emerald-200 bg-emerald-50',
            'amber': 'from-amber-500 to-orange-500 text-amber-600 border-amber-200 bg-amber-50',
            'red': 'from-red-500 to-rose-600 text-red-600 border-red-200 bg-red-50',
            'blue': 'from-blue-500 to-indigo-500 text-blue-600 border-blue-200 bg-blue-50',
            'fuchsia': 'from-fuchsia-500 to-pink-500 text-fuchsia-600 border-fuchsia-200 bg-fuchsia-50'
        };

        // État de l'application
        let currentView = 'commun';
        let viewDate = new Date(); // Date utilisée pour l'affichage (mois par mois)
        let pieChartInstance = null;
        let histChartInstance = null;
        let activeBilanData = [];

        function saveDB() {
            localStorage.setItem('my_budget_db', JSON.stringify(db));
            const dataStr = "let db = " + JSON.stringify(db, null, 4) + ";";
            const blob = new Blob([dataStr], { type: "text/javascript" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "data.js";
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            renderApp();
        }

        // --- NAVIGATION MOIS ---
        function getMonthKey(date) { 
            return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
        }
        function changeMonth(delta) {
            viewDate.setMonth(viewDate.getMonth() + delta);
            renderApp();
        }

        // --- VUES & MODALS ---
        function switchView(view) {
            currentView = view;
            ['moi', 'commun', 'pro'].forEach(v => {
                const btn = document.getElementById(`btn-${v}`);
                btn.className = v === view ? "px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-neonPink to-neonPurple text-white shadow-md flex items-center" 
                                           : "px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center";
            });
            renderApp();
        }

        function openModal(id, envId = null) {
            document.getElementById(id).classList.remove('hidden');
            if(id === 'envelopeModal') {
                document.getElementById('env-id').value = envId || '';
                if(envId) {
                    const e = db.envelopes.find(x => x.id === envId);
                    document.getElementById('env-modal-title').innerHTML = `<i class="fa-solid fa-pen"></i> Modifier`;
                    document.getElementById('env-name').value = e.name;
                    document.getElementById('env-wallet').value = e.wallet;
                    document.getElementById('env-budget').value = e.budget;
                    document.getElementById('env-alert').value = e.alertThreshold || 80;
                    document.getElementById('env-type').value = e.type;
                    document.getElementById('env-color').value = e.color || 'pink';
                    document.getElementById('env-icon').value = e.icon || 'fa-basket-shopping';
                } else {
                    document.getElementById('env-modal-title').innerHTML = `<i class="fa-solid fa-folder-plus"></i> Créer`;
                    document.getElementById('env-wallet').value = currentView;
                    document.getElementById('env-name').value = ''; document.getElementById('env-budget').value = '';
                }
            }
            if (id === 'expenseModal') { document.getElementById('exp-wallet').value = currentView; updateEnvelopeOptions(); document.getElementById('exp-date').valueAsDate = new Date(); }
            if (id === 'incomeModal') { document.getElementById('inc-wallet').value = currentView; document.getElementById('inc-date').valueAsDate = new Date(); }
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function toggleMenu(id) {
            document.querySelectorAll('.env-menu').forEach(el => { if(el.id !== 'menu-'+id) el.classList.add('hidden'); });
            document.getElementById('menu-'+id).classList.toggle('hidden');
        }
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.env-card')) document.querySelectorAll('.env-menu').forEach(el => el.classList.add('hidden'));
        });

        // --- LOGIQUE RENDU ---
        function renderApp() {
            const mKey = getMonthKey(viewDate);
            document.getElementById('current-month-display').innerText = viewDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }).toUpperCase();
            
            let envs = db.envelopes.filter(e => e.wallet === currentView);
            let txs = db.transactions.filter(t => t.wallet === currentView && t.date.startsWith(mKey));
            
            // Calculs globaux
            let totalIncomes = txs.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
            let totalExpenses = txs.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);
            let totalTransfersIn = txs.filter(t => t.type === 'transfer_in').reduce((s,t) => s+t.amount, 0);
            let totalTransfersOut = txs.filter(t => t.type === 'transfer_out').reduce((s,t) => s+t.amount, 0);
            
            let totalBudget = envs.reduce((s,e) => s + Number(e.budget), 0) + totalTransfersIn - totalTransfersOut;
            let globalBalance = totalBudget - totalExpenses;
            
            // --- GESTION DES COULEURS DU BLOC SOLDE ---
            let globalPct = totalBudget ? (totalExpenses/totalBudget)*100 : 0;
            
            let soldeCard = document.getElementById('solde-card');
            let statBalance = document.getElementById('stat-balance');
            let soldeLabel = document.getElementById('solde-label');
            let soldeSublabel = document.getElementById('solde-sublabel');
            let statTotalBudget = document.getElementById('stat-total-budget');
            let soldeIcon = document.getElementById('solde-icon');
            let soldeWarning = document.getElementById('solde-warning');

            // Reset des classes dynamiques pour le Solde Restant
            soldeCard.className = 'border p-5 rounded-2xl shadow-sm relative overflow-hidden group transition-all duration-300';
            soldeLabel.className = 'text-xs font-bold uppercase transition-colors';
            soldeSublabel.className = 'text-xs mt-2 font-semibold transition-colors';
            soldeIcon.className = 'fa-solid fa-scale-balanced text-2xl transition-colors';
            statBalance.className = 'text-3xl font-black mt-2 transition-colors';
            statTotalBudget.className = 'transition-colors';
            soldeWarning.innerHTML = '';

            if (globalPct > 100) {
                // + de 100% consommé : Alerte Rouge Intégrale
                soldeCard.classList.add('bg-red-500', 'border-red-600', 'shadow-[0_0_20px_rgba(239,68,68,0.3)]');
                soldeLabel.classList.add('text-white/90');
                soldeSublabel.classList.add('text-white/90');
                statTotalBudget.classList.add('text-white');
                soldeIcon.classList.add('text-white/30');
                statBalance.classList.add('text-white');
                soldeWarning.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-white text-xl animate-pulse"></i>';
            } else {
                // Sous les 100% : bloc normal, couleur du texte selon pourcentage
                soldeCard.classList.add('bg-cardBg', 'border-slate-200');
                soldeLabel.classList.add('text-slate-400');
                soldeSublabel.classList.add('text-slate-400');
                statTotalBudget.classList.add('text-slate-600');
                soldeIcon.classList.add('text-slate-200');
                
                if (globalPct <= 20) {
                    statBalance.classList.add('text-green-700'); // Vert foncé
                } else if (globalPct <= 40) {
                    statBalance.classList.add('text-green-400'); // Vert clair
                } else if (globalPct <= 60) {
                    statBalance.classList.add('text-yellow-500'); // Jaune
                } else if (globalPct <= 80) {
                    statBalance.classList.add('text-orange-500'); // Orange
                } else {
                    statBalance.classList.add('text-red-500'); // Rouge
                }
            }

            // Injections des textes des Kpis
            document.getElementById('stat-incomes').innerText = totalIncomes.toFixed(2) + ' €';
            document.getElementById('stat-expenses').innerText = totalExpenses.toFixed(2) + ' €';
            statTotalBudget.innerText = totalBudget.toFixed(2) + ' €';
            statBalance.innerText = globalBalance.toFixed(2) + ' €';
            
            // Jauge de consommation globale
            let displayGlobalPct = Math.min(100, globalPct);
            document.getElementById('global-progress').style.width = displayGlobalPct + '%';
            if(globalPct > 100) {
                document.getElementById('global-progress').className = 'h-full rounded-full transition-all bg-white';
            } else {
                document.getElementById('global-progress').className = `h-full rounded-full transition-all ${displayGlobalPct>90 ? 'bg-red-500' : 'bg-gradient-to-r from-neonCyan to-neonPurple'}`;
            }

            // Rendu Enveloppes
            let envContainer = document.getElementById('envelopes-container');
            envContainer.innerHTML = '';
            let chartLabels = [], chartData = [], chartColors = [];

            envs.forEach(env => {
                let envTxs = txs.filter(t => t.envelopeId === env.id && t.type === 'expense');
                let envSpent = envTxs.reduce((s,t) => s+t.amount, 0);
                let envTransfersIn = txs.filter(t => t.envelopeId === env.id && t.type === 'transfer_in').reduce((s,t) => s+t.amount, 0);
                let envTransfersOut = txs.filter(t => t.envelopeId === env.id && t.type === 'transfer_out').reduce((s,t) => s+t.amount, 0);
                
                let activeBudget = Number(env.budget) + envTransfersIn - envTransfersOut;
                let remaining = activeBudget - envSpent;

                // Cache les enveloppes épargnes vides pour le mois en cours
                if (env.type === 'savings' && activeBudget === 0 && envSpent === 0) return;

                let pct = activeBudget ? Math.min(100, (envSpent/activeBudget)*100) : 0;
                let thres = env.alertThreshold || 80;
                
                let isOver = remaining < 0;
                let colorCls = colorMap[env.color || 'pink'];
                let bgCard = isOver ? 'bg-red-50 border-red-300 shadow-[0_0_15px_rgba(255,0,0,0.1)]' : 'bg-cardBg border-slate-200 hover:border-slate-300';
                
                if(envSpent > 0) { chartLabels.push(env.name); chartData.push(envSpent); chartColors.push(isOver ? '#ef4444' : '#0099ff'); }

                envContainer.innerHTML += `
                    <div class="${bgCard} border p-5 rounded-2xl relative env-card group transition-all">
                        <div class="absolute top-4 right-4">
                            <button onclick="toggleMenu('${env.id}')" class="text-slate-400 hover:text-slate-800 p-1"><i class="fa-solid fa-ellipsis-vertical text-lg"></i></button>
                            <div id="menu-${env.id}" class="env-menu hidden absolute right-0 top-6 w-36 bg-white border border-slate-200 shadow-xl rounded-xl py-1 z-10 text-sm">
                                <button onclick="openModal('envelopeModal', '${env.id}')" class="w-full text-left px-4 py-2 hover:bg-slate-50"><i class="fa-solid fa-pen text-slate-400 mr-2"></i> Modifier</button>
                                <button onclick="showHistory('${env.id}')" class="w-full text-left px-4 py-2 hover:bg-slate-50"><i class="fa-solid fa-chart-line text-slate-400 mr-2"></i> Historique</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr ${colorCls} flex items-center justify-center text-white shadow-sm">
                                <i class="fa-solid ${env.icon || 'fa-basket-shopping'}"></i>
                            </div>
                            <div>
                                <h3 class="font-black text-slate-800 flex items-center gap-2">${env.name} ${env.type==='savings'?'🏦':''} ${isOver?'<i class="fa-solid fa-triangle-exclamation text-red-500" title="Dépassement !"></i>':''}</h3>
                                <p class="text-xs text-slate-500">${activeBudget.toFixed(2)} € prévus</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-end mb-2">
                            <div class="text-2xl font-black ${isOver ? 'text-red-600' : 'text-slate-800'}">${envSpent.toFixed(2)} €</div>
                            <div class="text-xs font-bold ${isOver ? 'text-red-500' : 'text-slate-400'}">${remaining > 0 ? 'Reste ' + remaining.toFixed(2)+'€' : 'Dépassé de '+Math.abs(remaining).toFixed(2)+'€'}</div>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2 relative overflow-hidden">
                            <div class="h-full rounded-full transition-all ${pct >= thres && !isOver ? 'bg-orange-400' : isOver ? 'bg-red-500' : 'bg-slate-800'}" style="width: ${pct}%"></div>
                        </div>
                        ${pct >= thres && !isOver ? `<p class="text-[10px] text-orange-500 mt-1 mt-1"><i class="fa-solid fa-bell"></i> Attention, budget presque atteint</p>` : ''}
                    </div>
                `;
            });

            // Tableau Transactions
            let tbody = document.getElementById('transactions-table');
            tbody.innerHTML = txs.sort((a,b) => new Date(b.date) - new Date(a.date)).map(t => {
                let env = db.envelopes.find(e => e.id === t.envelopeId);
                let isExp = t.type === 'expense';
                let isTrans = t.type.startsWith('transfer');
                let color = isExp ? 'text-slate-800' : 'text-neonPink';
                if(isTrans) color = 'text-amber-600';
                return `<tr class="border-b border-slate-50 hover:bg-slate-50/50">
                    <td class="p-3 text-slate-500">${new Date(t.date).toLocaleDateString('fr-FR')}</td>
                    <td class="p-3 font-medium">${t.label}</td>
                    <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] uppercase font-bold">${env ? env.name : (isTrans?'Transfert/Bilan':'-')}</span></td>
                    <td class="p-3 text-right font-black ${color}">${isExp ? '-' : '+'}${t.amount.toFixed(2)} €</td>
                </tr>`;
            }).join('');

            // Mise à jour Camembert
            if(pieChartInstance) pieChartInstance.destroy();
            const ctxPie = document.getElementById('expensePieChart').getContext('2d');
            pieChartInstance = new Chart(ctxPie, {
                type: 'doughnut',
                data: { labels: chartLabels, datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }

        // --- SOUMISSIONS ---
        function updateEnvelopeOptions() {
            let select = document.getElementById('exp-envelope');
            select.innerHTML = db.envelopes.filter(e => e.wallet === document.getElementById('exp-wallet').value).map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        }

        function handleExpenseSubmit(e) {
            e.preventDefault();
            db.transactions.push({
                id: Date.now().toString(), type: 'expense', wallet: document.getElementById('exp-wallet').value,
                amount: Number(document.getElementById('exp-amount').value), envelopeId: document.getElementById('exp-envelope').value,
                date: document.getElementById('exp-date').value, label: document.getElementById('exp-note').value || 'Dépense'
            });
            closeModal('expenseModal'); saveDB();
        }

        function handleIncomeSubmit(e) {
            e.preventDefault();
            db.transactions.push({
                id: Date.now().toString(), type: 'income', wallet: document.getElementById('inc-wallet').value,
                amount: Number(document.getElementById('inc-amount').value), date: document.getElementById('inc-date').value, label: document.getElementById('inc-label').value
            });
            closeModal('incomeModal'); saveDB();
        }

        function handleEnvelopeSubmit(e) {
            e.preventDefault();
            let id = document.getElementById('env-id').value;
            let envData = {
                id: id || Date.now().toString(), name: document.getElementById('env-name').value,
                wallet: document.getElementById('env-wallet').value, budget: Number(document.getElementById('env-budget').value),
                alertThreshold: Number(document.getElementById('env-alert').value), type: document.getElementById('env-type').value,
                color: document.getElementById('env-color').value, icon: document.getElementById('env-icon').value
            };
            if(id) { let idx = db.envelopes.findIndex(x => x.id === id); db.envelopes[idx] = envData; } 
            else db.envelopes.push(envData);
            closeModal('envelopeModal'); saveDB();
        }

        // --- HISTORIQUE GRAPHIQUE ---
        function showHistory(envId) {
            let env = db.envelopes.find(e => e.id === envId);
            document.getElementById('hist-title').innerHTML = `<i class="fa-solid fa-chart-line text-${env.color}-500"></i> ${env.name}`;
            
            // Calculer les 6 derniers mois
            let labels=[], budgets=[], spents=[];
            let d = new Date(viewDate); d.setMonth(d.getMonth()-5);
            for(let i=0; i<6; i++) {
                let mK = getMonthKey(d);
                labels.push(d.toLocaleDateString('fr-FR', {month:'short'}));
                let txs = db.transactions.filter(t => t.envelopeId === envId && t.date.startsWith(mK));
                spents.push(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
                let activeB = env.budget + txs.filter(t=>t.type==='transfer_in').reduce((s,t)=>s+t.amount,0) - txs.filter(t=>t.type==='transfer_out').reduce((s,t)=>s+t.amount,0);
                budgets.push(activeB);
                d.setMonth(d.getMonth()+1);
            }

            openModal('historyModal');
            if(histChartInstance) histChartInstance.destroy();
            histChartInstance = new Chart(document.getElementById('envHistoryChart').getContext('2d'), {
                type: 'bar', data: { labels, datasets: [{label: 'Dépensé', data: spents, backgroundColor: '#ff007f'}, {label: 'Budget Actif', data: budgets, backgroundColor: '#e2e8f0'}] },
                options: { responsive:true, maintainAspectRatio:false, scales: {y: {beginAtZero:true}} }
            });
        }

        // --- LE BILAN DU MOIS ---
        function prepareBilan() {
            let mKey = getMonthKey(viewDate);
            let envs = db.envelopes.filter(e => e.wallet === currentView);
            let txs = db.transactions.filter(t => t.wallet === currentView && t.date.startsWith(mKey));
            let html = ''; activeBilanData = [];

            envs.forEach(env => {
                let spent = txs.filter(t => t.envelopeId === env.id && t.type === 'expense').reduce((s,t) => s+t.amount, 0);
                let transIn = txs.filter(t => t.envelopeId === env.id && t.type === 'transfer_in').reduce((s,t) => s+t.amount, 0);
                let transOut = txs.filter(t => t.envelopeId === env.id && t.type === 'transfer_out').reduce((s,t) => s+t.amount, 0);
                let remaining = (Number(env.budget) + transIn - transOut) - spent;
                
                if (remaining > 0) {
                    if (env.type !== 'savings') {
                        html += `
                        <div class="bg-green-50 border border-green-200 p-4 rounded-xl flex justify-between items-center">
                            <div><h4 class="font-bold text-green-800">${env.name}</h4><p class="text-xs text-green-600">+ ${remaining.toFixed(2)} € non consommés</p></div>
                            <label class="flex items-center gap-2 text-sm font-bold text-green-700 cursor-pointer">
                                <input type="checkbox" id="bilan-save-${env.id}" class="w-5 h-5 accent-green-600" checked> Transférer vers Épargne le mois prochain
                            </label>
                        </div>`;
                        activeBilanData.push({id: env.id, type: 'to_savings', amount: remaining});
                    } else {
                        html += `
                        <div class="bg-purple-50 border border-purple-200 p-4 rounded-xl flex justify-between items-center">
                            <div><h4 class="font-bold text-purple-800">${env.name}</h4><p class="text-xs text-purple-600">+ ${remaining.toFixed(2)} € restants</p></div>
                            <label class="flex items-center gap-2 text-sm font-bold text-purple-700 cursor-pointer">
                                <input type="checkbox" id="bilan-save-${env.id}" class="w-5 h-5 accent-purple-600" checked> Reporter l'épargne au mois suivant
                            </label>
                        </div>`;
                        activeBilanData.push({id: env.id, type: 'rollover_savings', amount: remaining});
                    }
                } else if (remaining < 0) {
                    let options = envs.filter(e => e.id !== env.id && e.type !== 'savings').map(e => `<option value="${e.id}">${e.name}</option>`).join('');
                    html += `
                    <div class="bg-red-50 border border-red-200 p-4 rounded-xl space-y-2">
                        <div class="flex justify-between">
                            <div><h4 class="font-bold text-red-800">${env.name}</h4><p class="text-xs text-red-600">Dépassé de ${Math.abs(remaining).toFixed(2)} €</p></div>
                        </div>
                        <select id="bilan-cover-${env.id}" class="w-full text-sm p-2 rounded-lg border-red-300">
                            <option value="">-- Choisir une enveloppe pour couvrir --</option>
                            ${options}
                        </select>
                    </div>`;
                    activeBilanData.push({id: env.id, type: 'cover_deficit', amount: Math.abs(remaining)});
                }
            });

            if(!html) html = '<p class="text-center text-slate-500 font-bold py-4">Rien à signaler, le budget est parfaitement équilibré ce mois-ci !</p>';
            document.getElementById('bilan-content').innerHTML = html;
            openModal('bilanModal');
        }

        function executeBilan() {
            let currentLastDayObj = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0);
            let lastDay = currentLastDayObj.getFullYear() + '-' + String(currentLastDayObj.getMonth()+1).padStart(2,'0') + '-' + String(currentLastDayObj.getDate()).padStart(2,'0');
            
            let nextFirstDayObj = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
            let nextMonthFirstDay = nextFirstDayObj.getFullYear() + '-' + String(nextFirstDayObj.getMonth()+1).padStart(2,'0') + '-' + String(nextFirstDayObj.getDate()).padStart(2,'0');

            activeBilanData.forEach(item => {
                if(item.type === 'to_savings' && document.getElementById(`bilan-save-${item.id}`).checked) {
                    let sourceEnv = db.envelopes.find(e => e.id === item.id);
                    let saveEnv = db.envelopes.find(e => e.name === sourceEnv.name + " (Épargne)" && e.wallet === currentView);
                    if(!saveEnv) {
                        saveEnv = { id: 'sav-'+Date.now()+Math.random(), name: sourceEnv.name + " (Épargne)", wallet: currentView, budget: 0, type: 'savings', color: sourceEnv.color, icon: 'fa-piggy-bank' };
                        db.envelopes.push(saveEnv);
                    }
                    db.transactions.push({ id: Date.now().toString()+Math.random(), type: 'transfer_out', wallet: currentView, amount: item.amount, envelopeId: sourceEnv.id, date: lastDay, label: 'Bilan: transfert vers épargne' });
                    db.transactions.push({ id: Date.now().toString()+Math.random(), type: 'transfer_in', wallet: currentView, amount: item.amount, envelopeId: saveEnv.id, date: nextMonthFirstDay, label: 'Report d\'épargne du mois précédent' });
                }
                
                if(item.type === 'rollover_savings' && document.getElementById(`bilan-save-${item.id}`).checked) {
                    db.transactions.push({ id: Date.now().toString()+Math.random(), type: 'transfer_out', wallet: currentView, amount: item.amount, envelopeId: item.id, date: lastDay, label: 'Report vers le mois suivant' });
                    db.transactions.push({ id: Date.now().toString()+Math.random(), type: 'transfer_in', wallet: currentView, amount: item.amount, envelopeId: item.id, date: nextMonthFirstDay, label: 'Report d\'épargne du mois précédent' });
                }

                if(item.type === 'cover_deficit') {
                    let targetId = document.getElementById(`bilan-cover-${item.id}`).value;
                    if(targetId) {
                        db.transactions.push({ id: Date.now().toString()+Math.random(), type: 'transfer_out', wallet: currentView, amount: item.amount, envelopeId: targetId, date: lastDay, label: 'Bilan: couverture de découvert' });
                        db.transactions.push({ id: Date.now().toString()+Math.random(), type: 'transfer_in', wallet: currentView, amount: item.amount, envelopeId: item.id, date: lastDay, label: 'Bilan: renflouement' });
                    }
                }
            });
            closeModal('bilanModal'); saveDB();
        }

        // INIT DÉMARRAGE
        switchView('commun');

    </script>
</body>
</html>
